<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krown Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="page-assortment" class="page active">
        <header class="header">
            <h1>KROWN <span>SHOP</span></h1>
        </header>
        
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Поиск товаров..." oninput="renderProducts()">
        </div>

        <div class="categories" id="categories"></div>
        <div class="products-grid" id="products-grid"></div>
    </div>

    <div id="page-cart" class="page">
        <header class="header with-back">
            <button class="back-btn" onclick="switchPage('assortment')">← Назад</button>
            <h2>🛒 Корзина</h2>
        </header>
        <div id="cart-container" class="cart-container"></div>
        <div class="cart-bottom" id="cart-bottom" style="display: none;">
            <div class="total-price">Итого: <b id="cart-total">0</b> Br</div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <div id="page-profile" class="page">
        <header class="header">
            <h2>Профиль</h2>
        </header>
        
        <div class="profile-card">
            <div class="avatar" id="user-avatar">👤</div>
            <div class="username" id="user-name">-</div>
            <div class="user-tag" id="user-tag">@username</div>
            <div class="tg-id-box">
                <span>TELEGRAM ID</span>
                <b id="user-id">0</b>
            </div>
            <div id="admin-panel-btn" style="display: none; margin-top: 15px; padding: 15px; background: #7c3aed; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold;" onclick="openAdminPanel()">
                ⚙️ Открыть Админ-Панель
            </div>
        </div>

        <div class="menu-list">
            <div class="menu-item">
                <div class="menu-icon">🎁</div>
                <div class="menu-text"><b>Промокоды</b><span>Ввести промокод на скидку</span></div>
                <div class="arrow">›</div>
            </div>
            <div class="menu-item" onclick="openManager()">
                <div class="menu-icon">💬</div>
                <div class="menu-text"><b>Менеджер</b><span>Поможем с заказом и вопросами</span></div>
                <div class="status-online">онлайн</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">📢</div>
                <div class="menu-text"><b>Канал</b><span>Новости, акции и обновления</span></div>
                <div class="arrow">›</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('assortment', this)">
            <div class="icon">🎁</div><span>Ассортимент</span>
        </div>
        <div class="nav-item" onclick="switchPage('cart', this)">
            <div class="icon">🛒 <span id="nav-cart-count" class="badge">0</span></div><span>Корзина</span>
        </div>
        <div class="nav-item" onclick="switchPage('profile', this)">
            <div class="icon">👤</div><span>Профиль</span>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
  </html>
